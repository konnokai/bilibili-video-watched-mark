<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilibili 觀看進度標記</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>觀看進度標記</h1>
          <p>本機紀錄已啟用</p>
        </div>
      </header>

      <section class="status" aria-live="polite">
        <div><strong id="video-count">-</strong><span>部影片</span></div>
        <div><strong id="part-count">-</strong><span>個分 P</span></div>
      </section>

      <section>
        <h2>站內歷史</h2>
        <p>經同意後，讀取目前登入帳號的一般投稿影片歷史。Cookie 不會離開 Bilibili。</p>
        <button id="import-history" type="button">匯入 Bilibili 歷史</button>
      </section>

      <section>
        <h2>雲端同步</h2>
        <div id="sync-unlinked">
          <p>建立同步碼，或輸入另一台裝置已有的同步碼。</p>
          <label for="bilibili-uid">Bilibili UID</label>
          <input id="bilibili-uid" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 123456">
          <button id="create-sync" type="button">建立同步碼</button>

          <label for="connect-sync-code">既有同步碼</label>
          <input id="connect-sync-code" type="password" autocomplete="off" placeholder="bvw_...">
          <button id="connect-sync" class="secondary-button" type="button">連結同步碼</button>
        </div>

        <div id="sync-linked" hidden>
          <p id="sync-account"></p>
          <label for="current-sync-code">同步碼</label>
          <div class="input-action">
            <input id="current-sync-code" type="password" readonly>
            <button id="copy-sync-code" class="secondary-button" type="button">複製</button>
          </div>
          <p id="last-synced"></p>
          <button id="sync-now" type="button">立即同步</button>
          <div class="button-row">
            <button id="disconnect-sync" class="secondary-button" type="button">解除連結</button>
            <button id="delete-sync" class="danger-button" type="button">刪除雲端資料</button>
          </div>
        </div>
      </section>

      <footer>
        <button id="clear-local" class="text-button" type="button">清除本機紀錄</button>
        <p id="message" role="status"></p>
      </footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
